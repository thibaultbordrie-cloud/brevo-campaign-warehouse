# Publishes the dbt documentation (lineage graph, every model and column) on GitHub Pages,
# built from the FICTIONAL demo warehouse. Runs on every push to main.
# One-time setting: Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project and dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "dbt-duckdb==1.10.1"

      - name: Build the demo warehouse and the dbt documentation
        env:
          WAREHOUSE_DB: ${{ github.workspace }}/data/demo.duckdb
        run: |
          python scripts/make_demo_db.py data/demo.duckdb
          cd transform
          python run_dbt.py build --profiles-dir .
          python run_dbt.py docs generate --static --profiles-dir .
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
