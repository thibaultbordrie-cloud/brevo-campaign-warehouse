[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brevo-campaign-warehouse"
version = "1.0.0"
description = "Daily Brevo email-campaign warehouse: DuckDB star schema, dbt, Dagster, alerts, BigQuery copy, rules-only question assistant."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thibault Bordrie" }]
keywords = ["data-engineering", "duckdb", "dbt", "dagster", "bigquery", "email-marketing", "brevo"]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brevo_warehouse = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
